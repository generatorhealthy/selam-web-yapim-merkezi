name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy-main
  # Never interrupt an FTP publish midway. A partial publish can expose new
  # index.html while some of its hashed page files are still missing.
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build
        env:
          CI: false

      - name: Deploy to Hostinger
        id: deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
          # Use a new manifest for each release. The FTP action otherwise
          # deletes hashed files from the previous release, breaking Safari
          # tabs that still reference those valid files.
          state-name: .ftp-deploy-sync-state-${{ github.run_id }}.json
          timeout: 120000
          log-level: minimal

      - name: Wait before retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - name: Deploy to Hostinger (retry)
        if: steps.deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
          state-name: .ftp-deploy-sync-state-${{ github.run_id }}.json
          timeout: 120000
          log-level: minimal
