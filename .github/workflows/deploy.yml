name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy-main
  # Never interrupt an FTP publish midway. A partial publish can expose new
  # index.html while some of its hashed page files are still missing.
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build
        env:
          CI: false

      - name: Prepare ordered release
        run: |
          mkdir -p .deploy-shell .deploy-index
          cp -a dist/. .deploy-shell/
          rm -rf .deploy-shell/assets .deploy-shell/index.html
          cp dist/index.html .deploy-index/index.html

      - name: Verify every generated page asset exists
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)="\/?(assets\/[^"]+)"/g)].map((m) => m[1]);
          const missing = refs.filter((ref) => !fs.existsSync(path.join('dist', ref)));
          if (missing.length) throw new Error(`Missing release assets: ${missing.join(', ')}`);
          console.log(`Verified ${refs.length} entry assets before publish.`);
          NODE

      # Hashed files are uploaded first. The document that references them is
      # uploaded last, so visitors can never receive an index for missing files.
      - name: Deploy versioned assets
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/assets/
          server-dir: /assets/
          state-name: .ftp-assets-${{ github.run_id }}.json
          timeout: 120000
          log-level: minimal

      - name: Deploy supporting files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./.deploy-shell/
          server-dir: /
          state-name: .ftp-shell-${{ github.run_id }}.json
          timeout: 120000
          log-level: minimal

      - name: Activate release
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./.deploy-index/
          server-dir: /
          state-name: .ftp-index-${{ github.run_id }}.json
          timeout: 120000
          log-level: minimal
