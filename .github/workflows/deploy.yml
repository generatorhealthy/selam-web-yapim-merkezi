name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy-main
  # Never interrupt an FTP publish midway.
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build
        env:
          CI: false

      # The FTP sync deletes files that are not in this upload. CDN edges or
      # browsers that still hold an older index.html would then request
      # missing app files and show a blank page. So every asset file stays
      # on the server for RETAIN_DAYS after the last release that used it.
      # The Actions cache carries the retained files plus their last-used time
      # (.asset-ages.txt); FTP is only a fallback source.
      - name: Restore retained release assets from cache
        uses: actions/cache/restore@v4
        with:
          path: .release-assets-cache
          key: release-assets-${{ github.run_id }}
          restore-keys: |
            release-assets-

      - name: Keep older releases' assets for RETAIN_DAYS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          RETAIN_DAYS: '14'
        run: |
          set +e
          now=$(date +%s)
          cutoff=$((now - RETAIN_DAYS*86400))
          ages=/tmp/asset-ages.txt
          : > "$ages"
          # This release's own files are used now.
          (cd dist/assets && find . -type f ! -name '.release-files.txt' ! -name '.asset-ages.txt' | sed 's|^\./||') > /tmp/own-assets.txt
          while IFS= read -r n; do echo "$now $n" >> "$ages"; done < /tmp/own-assets.txt
          kept=0; dropped=0
          if [ -f .release-assets-cache/.asset-ages.txt ]; then
            while IFS=' ' read -r t name; do
              [ -z "$name" ] && continue
              [ -f "dist/assets/$name" ] && continue
              if [ "$t" -lt "$cutoff" ]; then dropped=$((dropped+1)); continue; fi
              [ -f ".release-assets-cache/$name" ] || continue
              mkdir -p "$(dirname "dist/assets/$name")"
              cp ".release-assets-cache/$name" "dist/assets/$name" && echo "$t $name" >> "$ages" && kept=$((kept+1))
            done < .release-assets-cache/.asset-ages.txt
          elif [ -d .release-assets-cache ]; then
            # Old cache format (one previous release, no ages): keep it now.
            while IFS= read -r name; do
              [ -f "dist/assets/$name" ] && continue
              mkdir -p "$(dirname "dist/assets/$name")"
              cp ".release-assets-cache/$name" "dist/assets/$name" && echo "$now $name" >> "$ages" && kept=$((kept+1))
            done < <(cd .release-assets-cache && find . -type f ! -name '.release-files.txt' ! -name '.asset-ages.txt' | sed 's|^\./||')
          fi
          echo "Kept $kept retained files from cache, dropped $dropped older than $RETAIN_DAYS days."
          # Fallback: whatever is live right now must also survive this deploy.
          base="ftp://${FTP_SERVER}/assets"
          if curl -sf --max-time 60 -u "${FTP_USERNAME}:${FTP_PASSWORD}" "${base}/.release-files.txt" -o /tmp/live-assets.txt; then
            echo "Using live release file list."
          elif curl -sf --max-time 60 -u "${FTP_USERNAME}:${FTP_PASSWORD}" "${base}/.ftp-assets-state.json" -o /tmp/live-assets-state.json; then
            node -e '
              const s = JSON.parse(require("fs").readFileSync("/tmp/live-assets-state.json","utf8"));
              for (const f of s.data || []) if (f.type === "file" && !f.name.startsWith(".")) console.log(f.name);
            ' > /tmp/live-assets.txt
          else
            : > /tmp/live-assets.txt
            echo "Could not read live file list over FTP."
          fi
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            [ -f "dist/assets/$name" ] && continue
            mkdir -p "$(dirname "dist/assets/$name")"
            if curl -sf --max-time 120 -u "${FTP_USERNAME}:${FTP_PASSWORD}" "${base}/${name}" -o "dist/assets/$name"; then
              echo "$now $name" >> "$ages"; kept=$((kept+1))
            else
              rm -f "dist/assets/$name"
            fi
          done < /tmp/live-assets.txt
          # Server-side list = every retained file, so the FTP fallback keeps them all.
          cut -d' ' -f2- "$ages" > dist/assets/.release-files.txt
          rm -rf .release-assets-cache
          cp -a dist/assets .release-assets-cache
          rm -f .release-assets-cache/.release-files.txt
          cp "$ages" .release-assets-cache/.asset-ages.txt
          echo "Release keeps $(wc -l < "$ages") asset files in total."
          exit 0

      - name: Save this release's assets for the next deploy
        uses: actions/cache/save@v4
        with:
          path: .release-assets-cache
          key: release-assets-${{ github.run_id }}

      - name: Prepare ordered release
        run: |
          mkdir -p .deploy-shell .deploy-index
          cp -a dist/. .deploy-shell/
          rm -rf .deploy-shell/assets .deploy-shell/index.html
          cp dist/index.html .deploy-index/index.html

      - name: Verify every generated page asset exists
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)="\/?(assets\/[^"]+)"/g)].map((m) => m[1]);
          const missing = refs.filter((ref) => !fs.existsSync(path.join('dist', ref)));
          if (missing.length) throw new Error(`Missing release assets: ${missing.join(', ')}`);
          console.log(`Verified ${refs.length} entry assets before publish.`);
          NODE

      # The single application file and styles are uploaded before index.html.
      - name: Deploy application assets
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/assets/
          server-dir: /assets/
          state-name: .ftp-assets-state.json
          timeout: 120000
          log-level: minimal

      - name: Deploy supporting files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./.deploy-shell/
          server-dir: /
          state-name: .ftp-shell-state.json
          timeout: 120000
          log-level: minimal

      - name: Activate release
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./.deploy-index/
          server-dir: /
          state-name: .ftp-index-state.json
          timeout: 120000
          log-level: minimal
