name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy-main
  # Never interrupt an FTP publish midway.
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build
        env:
          CI: false

      # The FTP sync deletes files that were in the previous upload but not in
      # this one. The live index.html still points at the previous app file
      # until the last step, so keep the previous release's assets for one more
      # deploy — otherwise visitors get a missing-file error mid-publish.
      - name: Keep the live release's assets during publish
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          base="ftp://${FTP_SERVER}/assets"
          # List of this release's own files (kept files are not added, so the
          # folder never grows beyond two releases).
          (cd dist/assets && find . -type f ! -name '.release-files.txt' | sed 's|^\./||') > /tmp/own-assets.txt
          if curl -sf --max-time 60 -u "${FTP_USERNAME}:${FTP_PASSWORD}" "${base}/.release-files.txt" -o /tmp/live-assets.txt; then
            echo "Using live release file list."
          elif curl -sf --max-time 60 -u "${FTP_USERNAME}:${FTP_PASSWORD}" "${base}/.ftp-assets-state.json" -o /tmp/live-assets-state.json; then
            node -e '
              const s = JSON.parse(require("fs").readFileSync("/tmp/live-assets-state.json","utf8"));
              for (const f of s.data || []) if (f.type === "file" && !f.name.startsWith(".")) console.log(f.name);
            ' > /tmp/live-assets.txt
          else
            : > /tmp/live-assets.txt
            echo "No previous release found; nothing to keep."
          fi
          kept=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            [ -f "dist/assets/$name" ] && continue
            mkdir -p "$(dirname "dist/assets/$name")"
            if curl -sf --max-time 120 -u "${FTP_USERNAME}:${FTP_PASSWORD}" "${base}/${name}" -o "dist/assets/$name"; then
              kept=$((kept+1))
            else
              rm -f "dist/assets/$name"
              echo "Could not keep $name"
            fi
          done < /tmp/live-assets.txt
          cp /tmp/own-assets.txt dist/assets/.release-files.txt
          echo "Kept $kept files from the live release."
          exit 0

      - name: Prepare ordered release
        run: |
          mkdir -p .deploy-shell .deploy-index
          cp -a dist/. .deploy-shell/
          rm -rf .deploy-shell/assets .deploy-shell/index.html
          cp dist/index.html .deploy-index/index.html

      - name: Verify every generated page asset exists
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)="\/?(assets\/[^"]+)"/g)].map((m) => m[1]);
          const missing = refs.filter((ref) => !fs.existsSync(path.join('dist', ref)));
          if (missing.length) throw new Error(`Missing release assets: ${missing.join(', ')}`);
          console.log(`Verified ${refs.length} entry assets before publish.`);
          NODE

      # The single application file and styles are uploaded before index.html.
      - name: Deploy application assets
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/assets/
          server-dir: /assets/
          state-name: .ftp-assets-state.json
          timeout: 120000
          log-level: minimal

      - name: Deploy supporting files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./.deploy-shell/
          server-dir: /
          state-name: .ftp-shell-state.json
          timeout: 120000
          log-level: minimal

      - name: Activate release
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./.deploy-index/
          server-dir: /
          state-name: .ftp-index-state.json
          timeout: 120000
          log-level: minimal
