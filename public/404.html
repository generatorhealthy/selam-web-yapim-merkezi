<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Sayfa Bulunamadı | Doktorum Ol</title>
  <meta name="description" content="Aradığınız sayfa bulunamadı. Doktorum Ol ana sayfasına veya uzman listesine dönebilirsiniz.">
  <style>
    :root { --background: 0 0% 100%; --foreground: 222 47% 11%; --primary: 221 83% 53%; --muted-foreground: 215 16% 37%; --border: 214 32% 91%; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: hsl(var(--foreground)); background: hsl(var(--background)); line-height: 1.6; }
    header { padding: 20px 24px; border-bottom: 1px solid hsl(var(--border)); }
    main { max-width: 720px; margin: 12vh auto; padding: 24px; }
    h1 { font-size: 32px; line-height: 1.2; }
    p { color: hsl(var(--muted-foreground)); }
    a { color: hsl(var(--primary)); text-underline-offset: 4px; }
    nav { display: flex; flex-wrap: wrap; gap: 24px; }
  </style>
</head>
<body>
  <header><a href="/">Doktorum Ol</a></header>
  <main>
    <p>404</p>
    <h1>Sayfa bulunamadı</h1>
    <p>Bu adres artık kullanılmıyor veya yanlış yazılmış olabilir.</p>
    <nav aria-label="Sayfaya dön"><a href="/">Ana sayfa</a><a href="/uzmanlar">Uzmanlar</a><a href="/blog">Blog</a></nav>
  </main>
</body>
</html>
